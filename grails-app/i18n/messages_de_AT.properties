aekos.submission.info.name=Submission Name
aekos.submission.info.name.help=Submission Name that distinguishes this submission from any of your other submissions, including previous versions of the submission or older submissions entered via SHaRED. This title is used for Administration purposes within SHaRED and also pre-populates the Dataset Name later in the questionnaire.
aekos.project.info.name=Projektname
aekos.project.info.name.help=
aekos.project.info.description=Projektbeschreibung
aekos.project.info.description.help=
aekos.project.info.status=Projektstatus
aekos.project.info.status.help=
aekos.dataset.info.name=Wie lautet der vollständige Titel Ihres Datensatzes?
aekos.dataset.info.name.help=Bitte geben Sie den formalen Namen an, der für den Datensatz verwendet wird. Beachten Sie, dass dieser Titel in einer von SHaRED erstellten Zitierbeschreibung verwendet wird. Jede Weiterverwendung Ihres Datensatzes durch andere wird diese Zitierbeschreibung verwenden.
aekos.dataset.content.fos=Welche Forschungsbereiche (Fields of Research, FOR) - wie in der Australian and New Zealand Standard Research Classification (ANZSRC) festgelegt - beschreiben den Datensatz?
aekos.dataset.content.fos.help=Bitte wählen Sie einen oder mehrere ANZRC FOR-Codes aus der Liste aus.
aekos.dataset.content.fos.extra=Wenn ein ANZRC-FOR-Code, der den Datensatz repräsentiert, nicht in der obigen Liste enthalten ist, geben Sie diesen bitte hier an
aekos.dataset.content.seo=Welche Socio-Economic Objectives (SEO) - gemäß der Australian and New Zealand Standard Research Classification (ANZSRC) - beschreiben den Datensatz?
aekos.dataset.content.seo.help=Bitte wählen Sie einen oder mehrere ANZRC SEO-Codes aus der Liste aus.
aekos.dataset.content.seo.extra=Wenn ein ANZRC-SEO-Code, der den Datensatz repräsentiert, nicht in der obigen Liste enthalten ist, geben Sie diesen bitte hier an
aekos.dataset.content.research=Welche Bereiche der ökologischen Forschung beschreiben Ihren Datensatz am besten?
aekos.dataset.content.research.help=Geben Sie den/die Bereich(e) der ökologischen Forschung an, der/die am besten die Aktivitäten beschreibt/beschreiben, die Ihr Datensatz unterstützt oder aus denen er entstanden ist. Führen Sie bis zu fünf Felder auf, wenn es kein dominantes Einzelthema gibt.
aekos.dataset.content.research.extra=Wenn ein gewünschtes ökologisches Thema nicht angeführt ist, geben Sie es bitte an.
aekos.dataset.content.threat=Welche Art von <threats and pressures> (oder anthropogenen Störungen) enthält der Datensatz?
aekos.dataset.content.threat.help=Wählen Sie die Arten von Bedrohungen (<threats>) und Belastungen (<pressures>) (oder menschlichen Störungen) aus, die für den Datensatz relevant sind.
aekos.dataset.content.threat.extra=Falls ein gewünschtes &quot;threats and pressures&quot;-Thema oben nicht aufgeführt ist, geben Sie es bitte an.
aekos.dataset.content.conservation=Welche Arten von Naturschutzmanagement oder NRM-Aktivitäten/-Themen enthält der Datensatz?
aekos.dataset.content.conservation.help=Wähle die Arten von Naturschutzmanagement oder NRM-Aktivitäten/-Themen, welche für den Datensatz relevant sind
aekos.dataset.content.conservation.extra=Falls die gewünschte Aktivität bzw. das gewünschte Thema oben nicht angeführt ist, geben Sie es bitte an.
aekos.project.objective=Welche(s) Ziel(e) wurde(n) bei der Erstellung dieses Datensatzes verfolgt?
aekos.project.objective.help=Bitte wählen Sie das/die Ziel(e) aus der Liste aus. Falls das gewünschte Ziel nicht in der Liste enthalten ist, geben Sie es bitte in der folgenden Frage an.
aekos.dataset.summary=Bitte geben Sie eine Zusammenfassung des Datensatzes an.
aekos.dataset.summary.help=Die Zusammenfassung sollte eine kurze Beschreibung der Studie, der verwendeten Methoden/der durchgeführten Tests (z. B. Bodenanalyse) und der daraus resultierenden Daten im Datensatz enthalten. (Keine Kommentare zu wissenschaftlichen Ergebnissen und Referenzen). Beachten Sie, dass die einleitenden Sätze den Datensatz und seine mögliche Wiederverwendung beschreiben sollten, um seine Wiederverwendung zu fördern. Die nachfolgenden Absätze sollten Hintergrundinformationen enthalten, die die Studie in den Kontext früherer Arbeiten stellen. (Beispiel: Dieser Datensatz beschreibt die physiologische Gesundheit der Tannenzapfenechse Tiliqua rugosa anhand von Hämatologie, Körpergröße und Vorhandensein von Ökoparasiten. Diese Daten können für eine vergleichende Analyse des physiologischen Zustands und der Verbreitung von T. rugosa in freier Wildbahn und in Gefangenschaft wiederverwendet werden. Terrestrische Reptilien haben das Potenzial, wichtige Umweltindikatoren in landwirtschaftlichen Umgebungen zu sein ...)
aekos.dataset.version=Datasatz-Version
aekos.dataset.version.help=Version des übermittelten Datensatzes 
aekos.project.keywords=Bitte geben Sie einige Schlagwörter/Keywords an, die Ihrer Meinung nach die Auffindbarkeit der Datensätze in AEKOS verbessern würden
aekos.project.keywords.help=Die Schlagwörter/Keywords sollten als Suchbegriffe in AEKOS betrachtet werden, die von den Nutzer:innen wahrscheinlich verwendet werden, um Ihren Datensatz zu finden und wiederzuverwenden. Bitte trennen Sie mehrere Schlagwörter durch Kommata.
aekos.activity.usageGuide=Bitte geben Sie an, wie der Datensatz von anderen weiterverwendet werden kann
aekos.activity.usageGuide.help=Bitte geben Sie eine kurze Anleitung, um anderen bei der Wiederverwendung des Datensatzes zu helfen. Die Informationen können Tipps für die Integration oder den Vergleich dieses Datensatzes mit anderen Datensätzen umfassen. Bei Studien, die den Schutz der Privatsphäre, Sicherheitskontrollen oder Datenbeschränkungen betreffen, ist anzugeben, wie die Autor:innen den Zugang zu eingeschränkten Daten beantragen können.
aekos.activity.relatedDatasets=Mit welchem/welchen anderen Datensatz/en ist dieser Datensatz verbunden?
aekos.activity.relatedDatasets.help=Wenn dieser Datensatz mit anderen Datensätzen außerhalb dieses Projekts in Verbindung steht, geben Sie bitte den/die Titel, IDs und andere Informationen an. Möglicherweise ist Ihnen ein anderes Projekt bekannt, das von einer anderen Organisation im selben Untersuchungsgebiet zu einem anderen Zeitpunkt durchgeführt wurde und sich mit anderen Themen befasst.
aekos.activity.urlImage=Bitte stellen Sie ein Foto oder ein anderes Bild zur Verfügung, das den Datensatz oder die Umgebung, in der die Daten gesammelt wurden, visuell darstellt.
aekos.activity.urlImage.help=Wenn Ihr Datensatz Fotos von dem/den Standort(en) enthält, an dem/denen die Daten erhoben wurden, wählen Sie bitte eines aus, das für die Umgebung(en), in der die Daten erhoben wurden, am repräsentativsten erscheint. Wenn Sie über andere Arten von Bildern verfügen, die die Daten visuell darstellen können, fügen Sie bitte eines davon bei
aekos.dataset.site=Bitte beschreiben Sie die geografische Ausdehnung ihres Datensatzes.
aekos.dataset.site.help=Bitte beschreiben Sie die geografische Ausdehnung des Gebiets, in dem die Daten für diesen Datensatz erhoben wurden. Z. B. Das Untersuchungsgebiet erstreckt sich im Norden bis zu den Ausläufern des Black Mt., im Osten bis zur Coastal Road, im Süden bis zum Muddy Creek und im Westen bis zur westlichen Grenze von Dingo Station.
