project.survey.info.methodType.content=Werden die Daten mit einer opportunistischen Ad-hoc-Beobachtungsmethode oder mit einem dokumentierten systematischen Erhebungs-/Stichprobenprotokoll erhoben? Im Falle einer systematischen Erhebung müssen Sie mindestens eine Möglichkeit zur Beschreibung der verwendeten Methodik und/oder des Probenahmeprotokolls angeben. Bitte geben Sie auch alle Abweichungen von der veröffentlichten Methode an.
project.survey.info.reliabilityTag.content=Diese Parameter sind ein Indikator für die Nutzenden Ihrer Daten, um festzustellen, wie zuversichtlich Sie hinsichtlich der Genauigkeit der Daten in jedem der vier für Forschende wichtigen Bereiche sind. Es ist wichtig, dass Sie ehrlich über Ihre Daten reflektieren, damit andere in der Lage sind, fundierte Entscheidungen über ihre Eignung für ihre Verwendung zu treffen. Im Allgemeinen sollte die Kategorisierung die Genauigkeit der qualitativ schlechtesten Aufzeichnung im Datensatz widerspiegeln.
project.survey.info.spatialAccuracy.content=Geben Sie die Kategorie an, die die am wenigsten genaue Aufzeichnung im Datensatz am besten wiedergibt.
project.survey.info.speciesIdentification.content=Geben Sie die Kategorie an, die am ehesten den am ungenauesten Datensatz zur Artenbestimmung widerspiegelt. Wählen Sie <Nicht zutreffend>, wenn Felder für Arten nicht im Datensatz enthalten sind.
project.survey.info.temporalAccuracy.content=Geben Sie die Kategorie an, die die ungenaueste Aufzeichnung im Datensatz in Bezug auf das Datum der Beobachtung am besten wiedergibt.
project.survey.info.nonTaxonomicAccuracy.content=Geben Sie die Kategorie an, die die ungenaueste Aufzeichnung im Datensatz in Bezug auf nicht-biodiversitätsbezogene Attribute am besten wiedergibt.
project.survey.info.dataQualityAssuranceMethod.content=Bitte geben Sie alle Methoden zur Sicherung der Datenqualität an, die Sie bei der Erfassung, Pflege und Verwaltung des Datensatzes angewandt haben.
project.survey.info.dataQualityAssuranceDescription.content=Bitte beschreiben Sie die Methoden, die zur Qualitätssicherung des Datensatzes sowohl während der Erfassung als auch nach der Verarbeitung verwendet wurden. Dies ist wichtig für andere Nutzende, um zu verstehen, welche Verfahren auf die Daten angewendet wurden, um ihre Qualität für die Verwendung zu überprüfen oder zu verbessern.
project.survey.info.dataAccessMethods.content=Bitte geben Sie an, welche Arten von Datenzugriff zur Verfügung stehen.
project.survey.info.dataAccessExternalURL.content=Wenn die Daten über eine Website verfügbar sind, geben Sie bitte die vollständige Webadresse (URL) an, damit die Besucher auf den Link klicken können, um die Daten aufzurufen.
project.survey.info.isDataManagementPolicyDocumented.content=Geben Sie an, ob für diesen Datensatz ein Datenmanagementplan erstellt wurde. Wenn <ja>, müssen Sie in mindestens einer der erforderlichen Kategorien Einzelheiten zu diesem Plan angeben.
project.survey.info.dataManagementPolicyDescription.content=Bitte geben beschreiben Sie die Datenmanagementrichtlinie. Dazu gehört, wie Daten gesammelt, verwaltet, gespeichert, kuratiert usw. werden und wie mit Daten und dem Schutz der Privatsphäre umgegangen wird.
project.survey.info.dataManagementPolicyURL.content=Wenn der Datenmanagementplan im Internet veröffentlicht wird, fügen Sie bitte eine vollständige Webadresse (URL) ein, die auf diesen Plan verweist.
project.survey.info.dataManagementPolicyDocument.content=Bitte fügen Sie ein Word- oder PDF-Dokument mit Ihrer Datenmanagementrichtlinie bei.
project.survey.info.alertText.1=\                            ACHTUNG: Es ist wichtig, die Erhebung vollständig zu beschreiben, um die Nutzenden, die Daten beisteuern, über die Erhebung zu informieren. Es ist auch von entscheidender Bedeutung, diese Informationen zu dokumentieren, damit die Datennutzenden verstehen können, wie sie gesammelt, verwaltet, kuratiert und qualitätsgesichert wurden, wie sie sie verwenden und zitieren können, usw. 
project.survey.info.alertText.2=Bitte nehmen Sie sich die Zeit, diese Metadatenvorlage so vollständig und genau wie möglich auszufüllen, denn davon hängt die Glaubwürdigkeit und Wiederverwendbarkeit Ihrer Daten ab.
project.survey.info.alertText.3=\                            Bewegen Sie den Mauszeiger über das <?>, um weitere Informationen zu den einzelnen Punkten zu erhalten.
