aekos.management.datasharing.license=Art der für den Datensatz geltenden Open-Access-Lizenz
aekos.management.datasharing.license.help=TERN Eco-informatics fördert den offenen Zugang zu öffentlich finanzierten Daten und veröffentlicht Datensätze nur unter einer Lizenz als Teil der TERN-Datenpolitik. Andere Lizenzen werden nicht bereitgestellt, da sie den offenen Zugang einschränken. Eine Creative Commons Attribution 4.0 International (CC BY 4.0) Lizenz erlaubt es anderen, das Material in jedem Medium oder Format zu kopieren und weiterzuverbreiten (share) und es für jeden Zweck, auch kommerziell, zu remixen, zu transformieren und darauf aufzubauen (adapt). Der Lizenzgeber (Sie) kann diese Freiheiten nicht widerrufen, solange die Datennutzer (Lizenznehmer) die Lizenzbedingungen einhalten. Es ist wichtig, dass Sie sich über die angemessene Namensnennung, den Hinweis auf vorgenommene Änderungen, technische Maßnahmen, Ausnahmen oder Beschränkungen sowie über Publizitäts-, Datenschutz- und Urheberrechte informieren.
aekos.acknowledgement=Wenn andere Personen, die nicht zu dem Datensatz beigetragen haben, genannt werden sollen, geben Sie bitte eine entsprechende Erklärung ab.
aekos.acknowledgement.help=Wenn andere Mitwirkende an dem Datensatz genannt werden sollen, fügen Sie bitte eine entsprechende Erklärung bei, in der die Mitwirkenden, die keine Autoren sind, genannt werden. Die Danksagung sollte kurz sein und Angaben zu Zuschüssen, Sachleistungen oder Beiträgen machen.
aekos.embargoOption=Wenn der Datensatz unter einem Embargo steht, geben Sie bitte das Enddatum des Embargos an.
aekos.embargoOption.help=Datensätze, die von den Autoren aktiv genutzt werden, deren zugehöriges Manuskript sich in der Begutachtung befindet und noch nicht zur Veröffentlichung angenommen wurde (z. B. Doktoranden) oder die aus anderen Gründen nicht für die Öffentlichkeit zugänglich sind, können in SHaRED gesperrt werden. Die Embargofrist beträgt zunächst 3 Jahre ab dem Datum der Einreichung des Datensatzes oder Datenpakets. Danach werden sie automatisch über das Australian Ecological Knowledge Observation System (AEKOS) öffentlich zugänglich gemacht. Anmerkung: Wenn Sie Ihren Datensatz früher zur Verfügung stellen möchten, senden Sie eine E-Mail an enquiry@aekos.org.au
aekos.legalCustodianOrganisation=Wählen Sie die Organisation(en) aus, die als rechtliche Verwahrer (<legal custodianship>) des Datensatzes gelten (d. h. die Rechte am geistigen Eigentum des Datensatzes haben).
aekos.legalCustodianOrganisation.help=Wählen Sie die Organisation, die als Verwahrer des Datensatzes gilt. Wenn die gewünschte Organisation nicht in der Liste enthalten ist, wählen Sie bitte Andere - Bitte vorschlagen und den Namen der Organisation angeben. Bitte geben Sie die Organisation an, die die Rechte am geistigen Eigentum der Datensätze besitzt. In der Regel ist dies die Organisation des Autors/der Autoren, die den Zuschuss für die Forschungsarbeiten erhalten hat. In Forschungsverträgen wird das geistige Eigentum beschrieben, und es kann viele kooperierende Organisationen betreffen. In diesem Fall muss die federführende Einrichtung mit den Mitautoren Kontakt aufnehmen und aushandeln, welche Einrichtung die Verantwortung für die Rechte an den Datensätzen übernimmt.
aekos.legalCustodianOrganisationType=Art der Organisationsverwaltung?
aekos.legalCustodianOrganisationType.help=Wählen Sie die Art der Organisationverwaltung (custodian organisation type). Wenn der gewünschte Organisationstyp nicht in der Liste enthalten ist, wählen Sie bitte Andere - Bitte geben Sie den Organisationstyp an.
