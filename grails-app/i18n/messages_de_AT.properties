map.heatmap.help.text=Die Heatmap stellt die Konzentration von Punkten und die geometrischen Schwerpunktkoordinaten von Linien und Flächen innerhalb definierter Gitterzellen dar.<br>\
  Bitte haben Sie etwas Geduld, die Darstellung der Ergebnisse einiger Analysen können aufgrund der komplexen Verarbeitung großer Datenmengen eine Weile dauern.
map.cluster.help.text=Der Cluster stellt die Konzentration von Punkten und die geometrischen Schwerpunktkoordinaten von Linien und Flächen innerhalb einer Region dar.<br>\
  Bitte haben Sie etwas Geduld, die Darstellung der Ergebnisse einiger Analysen können aufgrund der komplexen Verarbeitung großer Datenmengen eine Weile dauern.
map.point.help.text=Standorte mit Punkten, <Flächen> und <Linien>. Punkte für <Flächen> und <Linien> werden vom geometrischen Schwerpunkt abgeleitet.<br>\
  Bitte haben Sie etwas Geduld, die Darstellung der Ergebnisse einiger Analysen können aufgrund der komplexen Verarbeitung großer Datenmengen eine Weile dauern.
map.polygon.help.text=Standorte mit <Flächen> werden gezeichnet. Es werden keine Standorte mit anderen Formen wie <Linien>, <Punkte> usw. gezeichnet.<br>\
  Bitte haben Sie etwas Geduld, die Darstellung der Ergebnisse einiger Analysen können aufgrund der komplexen Verarbeitung großer Datenmengen eine Weile dauern.
map.line.help.text=Standorte mit <Lininen> werden gezeichnet. Es werden keine Standorte mit anderen Formen wie <Flächen>, <Punkte> usw. gezeichnet.<br>\
  Bitte haben Sie etwas Geduld, die Darstellung der Ergebnisse einiger Analysen können aufgrund der komplexen Verarbeitung großer Datenmengen eine Weile dauern.

biocollect.data.map.selector.help.title=Hilfe
biocollect.data.map.selector.help.content=Wählen Sie aus, den Benutzer:innen die Projektdaten auf einer Karte dargestellt werden sollen. Die Optionen sind \
  Heatmap, Cluster, Punkt, Polygon and Linie. Die Benutzeroptionen können je nach Status des Benutzers eingeschränkt werden. \
  Die Anzeigeoption kann durch Deaktivieren des Häkchens entfernt werden. Verwenden Sie die Spalte isDefault, um die Standardoption auszuwählen. \
  Die verschiedenen Status sind - Projektmitglied, angemeldeter Benutzer, abgemeldeter Benutzer.<br>\
  <strong>Hinweis!</strong><br>\
  Heatmap - Konzentration von Punkten und geometrischen Schwerpunktkoordinaten von Linien und Flächen innerhalb definierter Gitterzellen. Die Heatmap wird schneller gerendert als andere Optionen.<br>\
  Linie oder Polygon - es werden nur Aktivitäten auf einer Linie bzw. einer Fläche angezeigt.<br>\
  Cluster - Konzentration von Punkten und den geometrischen Schwerpunktkoordinaten von Linien und Flächen innerhalb einer Region.\
  Punkt - zeigt alle Aktivitäten unabhängig von der Form an. Wenn eine Aktivität auf einer Fläche oder Linie liegt, wird der geometrische Schwerpunkt der Form verwendet. Punkt ist die langsamste aller Optionen.\

