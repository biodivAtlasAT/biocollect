project.survey.info.name.content=Geben Sie einen Namen für das Erheung (Survey) ein. Dies ist der Name, den die Teilnehmenden sehen, wenn sie Daten hinzufügen und anzeigen.
project.survey.info.description=Beschreibung:
project.survey.info.description.content=Eine kurze Beschreibung des Projekts soll den Teilnehmenden dabei helfen, zu entscheiden, ob sie ihre Daten einbringen sollen/möchten.
project.survey.info.startDate=Startdatum:
project.survey.info.startDate.content=Das Startdatum der Erhebung muss mit dem Startdatum des Projekts übereinstimmen oder danach liegen.
project.survey.info.endDate=Enddatum:
project.survey.info.endDate.content=Wenn die Umfrage nur für eine begrenzte Zeit läuft, sollten Sie ein Enddatum angeben. So wissen die Teilnehmenden, ob das Projekt noch aktiv ist, wie viel Zeit sie noch haben, um Daten hinzuzufügen usw. Sie können das Enddatum jederzeit ändern.
project.survey.info.publicData=Öffentlichen Nutzer:innen erlauben, Daten einzugeben:
project.survey.info.publicData.content=Wenn Sie diese Option aktivieren, können auch Personen, die nicht Mitglied des Projekts sind, Daten für die Erhebung eingeben.
project.survey.info.comments=Kommentare zu Beobachtungen erlauben
project.survey.info.comments.content=Wenn Sie diese Option aktivieren, können alle Personen, die die Daten für die Erhebung einsehen, Kommentare zu einzelnen Datensätzen hinzufügen.
project.survey.info.logo=Logo hinzufügen:
project.survey.info.logo.content=Wenn Sie Ihrer Umfrage ein Logo hinzufügen, wird sie besser sichtbar und identifizierbar. Es wird zusammen mit den Umfragedaten auf der Seite mit den Umfragelisten und auch in den mobilen Apps angezeigt.
project.survey.info.attribution=Survey attribution/citation:
project.survey.info.methodName=Verwendete Monitoring-/Erhebungsmethode:
project.survey.info.methodName.content=Geben Sie den Namen der Erhebungsmethode/Probennahme an, die zur Datenerhebung für dieses Survey verwendet wurde (z.B. 2ha 20 min Vogelerhebung).
project.survey.info.methodAbstract=Beschreibung der Erhebungsmethode/Probennahme:
project.survey.info.methodAbstract.content=Bitte beschreiben Sie die Methode, mit der die Daten für diese Erhebung erhoben wurden. Beachten Sie insbesondere die Dauer der Probennahme, das erfasste Gebiet (Größe und Form), die Anzahl der Personen bei einer Probennahme und ihr kollektives Fachwissen sowie alles, was die Repräsentativität der erhobenen Daten beeinflussen könnte.
project.survey.info.methodUrl=Website der Erhebungsmethode/Methode der Probennahme:
project.survey.info.methodUrl.content=Geben Sie eine Website-Adresse für die Erhebungs-/Probenahme-Methode an
project.survey.info.methodDoc=Dokumentationen zur Erhebungsmethode/Methode der Probennahme:
project.survey.info.methodDoc.content=Laden Sie zusätzliche Unterlagen/Dokumente für die Erhebungsmethode/Methode der PRobennahme hoch
project.survey.info.usageGuide=Datenbias und Einschränkungen:
project.survey.info.usageGuide.content=Bitte beschreiben Sie etwaige Einschränkungen und Verzerrungen im Datensatz, die mit der Art und Weise der Datenerhebung zusammenhängen, z. B. Konzentration von Datenpunkten entlang von Zugängen, gezielte/nicht zufällige Ansätze, die zu einer Verzerrung bestimmter Faktoren auf Kosten anderer Faktoren führen, usw.
