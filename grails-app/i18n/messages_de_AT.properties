aekos.sampling.design=Bitte wählen Sie eine Samplingmethode aus, die am besten beschreibt, wie Ihr Ansatz für die Datenerhebung erstellt wurde
aekos.sampling.design.help=Wählen Sie aus der Liste eine wissenschaftliche Samplingmethode aus, das Ihrer Meinung nach am besten das Konzept widerspiegelt, das bei der Festlegung der Untersuchungsstandorte und Monitoringprotokolle für den Datensatz gewählt wurde. Jede Studie ist eine Informationserhebung, bei der es Abweichungen gibt, unabhängig davon, ob der:die Datenerfasser:in die Kontrolle darüber hat oder nicht. Es ist nicht möglich, Informationen oder Messungen zu jedem einzelnen Punkt zu sammeln, und wenn man dies nicht tut, besteht die Möglichkeit von Stichprobenverzerrungen oder -fehlern. Um diese Fehler zu minimieren und quantitative Daten zu sammeln, entwerfen die Projektverantwortlichen Studien unter Verwendung eines entsprechenden Samplingverfahren oder Samplingprogramms. Hier sind einige gängige Samplingmethoden aufgeführt, die jedoch je nach Studie in individuelle Samplingmethoden umgewandelt werden können. Weitere Informationen finden Sie unter Versuchsplanung.
aekos.sampling.design.suggest=Wenn Ihr Datensatz anhand von Samplingmethoden erstellt wurde, die nicht in der obigen Liste aufgeführt sind, geben Sie bitte diese Samplingmethoden an.
aekos.measurement.theme=Welche Arten von Messungen oder Beobachtungen enthält der Datensatz?
aekos.measurement.theme.help=Bei den Daten kann es sich entweder um Rohdaten oder abgeleiteten Daten handeln. Rohdaten sind beispielsweise direkte Beobachtungen oder Messungen die gesammelt wurden. Abgeleitete Daten stammen aus anderen Quellen, wie z. B. Niederschlagsaufzeichnungen des Bureau of Meterology oder Werte, die von den Spatial Layern der Geoscience Australia extrahiert wurden. Diese Daten können weiter in verschiedene Datentypen unterteilt werden, wie z. B. kontinuierliche Daten (reelle Zahlen mit Dezimalwerten, z. B. Temperatur, Größe, Gewicht), Zählungen (positive Zahlen 1,2,3...), binäre Daten (1/0, ja/nein, wahr/falsch), kategorische Daten (d. h. Klassen wie die Braun-Blanquet-Skala für die Deckungsdichte, Blutgruppe, Altersklassen) und ordinale Daten (relative Punktzahl, die insbesondere für Ranglisteninformationen verwendet wird). Weniger häufig sind multivariate Daten.
aekos.measurement.theme.suggest=Enthält der Datensatz andere Messgrößen, die nicht in der obigen Liste aufgeführt sind, geben Sie diese bitte an.
aekos.measurement.theme.suggest.help=
